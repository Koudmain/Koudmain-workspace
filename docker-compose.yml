services:
  # Koudmain frontend
  frontend:
    build:
      context: ${WEB_PATH_FOLDER}
      target: development
    container_name: koudmain-frontend
    env_file: .env
    ports:
      - 8080:8080
    volumes:
      - ${WEB_PATH_FOLDER}:${WORKDIR_WEB_PATH_FOLDER}
      - ${WORKDIR_WEB_PATH_FOLDER}/node_modules
    depends_on:
      - backend

  # Koudmain mobile employer
  mobile-employer:
    build:
      context: ${MOBILE_PATH_FOLDER}
      target: development-employer
      args:
        REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
        EXPO_CLIENT_FLAG: ${EXPO_CLIENT_FLAG:---go}
    container_name: koudmain-mobile-employer
    env_file: .env
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      EXPO_PUBLIC_REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    stdin_open: true
    tty: true
    ports:
      - 8082:8082
    volumes:
      - ${MOBILE_PATH_FOLDER}:${WORKDIR_MOBILE_PATH_FOLDER}
      - ${WORKDIR_MOBILE_PATH_FOLDER}/node_modules
      - ~/.expo:/root/.expo
    depends_on:
      - backend

  # Koudmain mobile worker
  mobile-worker:
    build:
      context: ${MOBILE_PATH_FOLDER}
      target: development-worker
      args:
        REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
        EXPO_CLIENT_FLAG: ${EXPO_CLIENT_FLAG:---go}
    container_name: koudmain-mobile-worker
    env_file: .env
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      EXPO_PUBLIC_REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    stdin_open: true
    tty: true
    ports:
      - 8083:8083
    volumes:
      - ${MOBILE_PATH_FOLDER}:${WORKDIR_MOBILE_PATH_FOLDER}
      - ${WORKDIR_MOBILE_PATH_FOLDER}/node_modules
      - ~/.expo:/root/.expo
    depends_on:
      - backend

  # Koudmain backend
  backend:
    build:
      context: ${BACKEND_PATH_FOLDER}
      target: development
    container_name: koudmain-backend
    env_file: .env
    ports:
      - 3000:3000
    volumes:
      - ${BACKEND_PATH_FOLDER}:${WORKDIR_BACKEND_PATH_FOLDER}
      - ${WORKDIR_BACKEND_PATH_FOLDER}/node_modules
      - ${WORKDIR_BACKEND_PATH_FOLDER}/dist
    depends_on:
      - db
      - redis
      - worker

  # Koudmain worker
  worker:
    build:
      context: ${WORKER_PATH_FOLDER}
      target: development
    container_name: koudmain-worker
    env_file: .env
    ports:
      - 4000:4000
    volumes:
      - ${WORKER_PATH_FOLDER}:${WORKDIR_WORKER_PATH_FOLDER}
      - ${WORKDIR_WORKER_PATH_FOLDER}/tmp
    depends_on:
      - db
      - redis

  # Koudmain postgresql database
  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: koudmain-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - koudmain-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Koudmain redis cache
  redis:
    image: redis:7-alpine
    container_name: koudmain-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
    ports:
      - 6379:6379
    volumes:
      - koudmain-redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}

  # Koudmain postgresql database for testing
  db-test:
    image: postgis/postgis:16-3.5-alpine
    container_name: koudmain-db-test
    environment:
      POSTGRES_USER: ${DB_TEST_USER}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
      POSTGRES_DB: ${DB_TEST_NAME}
    ports:
      - "${DB_TEST_PORT}:${DB_TEST_DOCKER_PORT}"
    volumes:
      - koudmain-db-test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_TEST_USER}", "-d", "${DB_TEST_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Builder APK employer
  build-apk-employer:
    build:
      context: ${MOBILE_PATH_FOLDER}
      dockerfile: Dockerfile.android
    image: koudmain-android-builder:latest
    working_dir: ${WORKDIR_MOBILE_PATH_FOLDER}
    cpus: 4
    mem_limit: 6g
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
    profiles:
      - "tools"
    volumes:
      - ${MOBILE_PATH_FOLDER}:${WORKDIR_MOBILE_PATH_FOLDER}
      - ${WORKDIR_MOBILE_PATH_FOLDER}/node_modules
      - ${WORKDIR_MOBILE_PATH_FOLDER}/apps/employer-app/node_modules
      - ${WORKDIR_MOBILE_PATH_FOLDER}/apps/worker-app/node_modules
      - gradle-cache:/root/.gradle
      - ./builds:${WORKDIR_MOBILE_PATH_FOLDER}/builds
      - ~/.expo:/root/.expo
    command: >
      bash -c "
        git config --global --add safe.directory '*' &&
        pnpm install --frozen-lockfile &&
        pnpm --filter @koudmain/employer exec eas build --platform android --profile development --local --output /usr/src/app/builds/employer-dev.apk &&
        chown -R ${HOST_UID}:${HOST_GID} /usr/src/app/builds
      "

  # Builder APK worker
  build-apk-worker:
    build:
      context: ${MOBILE_PATH_FOLDER}
      dockerfile: Dockerfile.android
    image: koudmain-android-builder:latest
    working_dir: ${WORKDIR_MOBILE_PATH_FOLDER}
    cpus: 4
    mem_limit: 6g
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
    profiles:
      - "tools"
    volumes:
      - ${MOBILE_PATH_FOLDER}:${WORKDIR_MOBILE_PATH_FOLDER}
      - ${WORKDIR_MOBILE_PATH_FOLDER}/node_modules
      - ${WORKDIR_MOBILE_PATH_FOLDER}/apps/employer-app/node_modules
      - ${WORKDIR_MOBILE_PATH_FOLDER}/apps/worker-app/node_modules
      - gradle-cache:/root/.gradle
      - ./builds:${WORKDIR_MOBILE_PATH_FOLDER}/builds
      - ~/.expo:/root/.expo
    command: >
      bash -c "
        git config --global --add safe.directory '*' &&
        pnpm install --frozen-lockfile &&
        pnpm --filter @koudmain/worker exec eas build  --platform android --profile development --local --output /usr/src/app/builds/worker-dev.apk &&
        chown -R ${HOST_UID}:${HOST_GID} /usr/src/app/builds
      "

volumes:
  koudmain-db:
  koudmain-db-test:
  koudmain-redis:
  gradle-cache:
