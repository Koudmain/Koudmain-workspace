services:
  # Koudmain frontend
  frontend:
    build:
      context: ${WEB_PATH_FOLDER}
      target: development
    container_name: koudmain-frontend
    env_file: .env
    ports:
      - 8080:8080
    volumes:
      - ${WEB_PATH_FOLDER}:${WORKDIR_WEB_PATH_FOLDER}
      - ${WORKDIR_WEB_PATH_FOLDER}/node_modules
    depends_on:
      - backend

  # Koudmain mobile employer
  mobile-employer:
    build:
      context: ${MOBILE_PATH_FOLDER}
      target: development-employer
      args:
        REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    container_name: koudmain-mobile-employer
    env_file: .env
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      EXPO_PUBLIC_REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    stdin_open: true
    tty: true
    ports:
      - 8082:8082
    volumes:
      - ${MOBILE_PATH_FOLDER}:${WORKDIR_MOBILE_PATH_FOLDER}
      - ${WORKDIR_MOBILE_PATH_FOLDER}/node_modules
    depends_on:
      - backend

  # Koudmain mobile worker
  mobile-worker:
    build:
      context: ${MOBILE_PATH_FOLDER}
      target: development-worker
      args:
        REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    container_name: koudmain-mobile-worker
    env_file: .env
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      EXPO_PUBLIC_REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    stdin_open: true
    tty: true
    ports:
      - 8083:8083
    volumes:
      - ${MOBILE_PATH_FOLDER}:${WORKDIR_MOBILE_PATH_FOLDER}
      - ${WORKDIR_MOBILE_PATH_FOLDER}/node_modules
    depends_on:
      - backend

  # Koudmain backend
  backend:
    build:
      context: ${BACKEND_PATH_FOLDER}
      target: development
      args:
        LOCAL_IP: ${LOCAL_IP:-}
    container_name: koudmain-backend
    env_file: .env
    environment:
      LOCAL_IP: ${LOCAL_IP:-}
    ports:
      - 3000:3000
    volumes:
      - ${BACKEND_PATH_FOLDER}:${WORKDIR_BACKEND_PATH_FOLDER}
      - ${WORKDIR_BACKEND_PATH_FOLDER}/node_modules
      - ${WORKDIR_BACKEND_PATH_FOLDER}/dist
    depends_on:
      - db
      - redis
      - worker

  # Koudmain worker
  worker:
    build:
      context: ${WORKER_PATH_FOLDER}
      target: development
    container_name: koudmain-worker
    env_file: .env
    ports:
      - 4000:4000
    volumes:
      - ${WORKER_PATH_FOLDER}:${WORKDIR_WORKER_PATH_FOLDER}
      - ${WORKDIR_WORKER_PATH_FOLDER}/tmp
    depends_on:
      - db
      - redis

  # Koudmain postgresql database
  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: koudmain-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - koudmain-db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Koudmain redis cache
  redis:
    image: redis:7-alpine
    container_name: koudmain-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
    ports:
      - 6379:6379
    volumes:
      - koudmain-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}

  db_test:
    image: postgis/postgis:16-3.5-alpine
    container_name: koudmain-db-test
    environment:
      POSTGRES_USER: ${DB_TEST_USER}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
      POSTGRES_DB: ${DB_TEST_NAME}
    ports:
      - "${DB_TEST_PORT}:${DB_TEST_DOCKER_PORT}"
    volumes:
      - koudmain-db-test:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${DB_TEST_USER}", "-d", "${DB_TEST_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  documenso:
    build:
      context: ${DOCUMENSO_PATH_FOLDER}
      args:
        LOCAL_IP: ${LOCAL_IP:-}
      dockerfile: apps/remix/Dockerfile
    container_name: koudmain-documenso
    ports:
      - 3010:3000
    env_file:
      - .env
      - .env.documenso
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailserver:
        condition: service_started
      minio:
        condition: service_started
      gotenberg:
        condition: service_started
    command: >
      sh -c "
        echo 'Synchronisation du schéma Prisma...' &&
        npx prisma db push --schema=packages/prisma/schema.prisma &&
        echo 'Démarrage de Documenso...' &&
        npm run dev --workspace=@documenso/remix -- --host
      "
    volumes:
      - ./cert.p12:/app/cert.p12:ro

  mailserver:
    image: inbucket/inbucket
    container_name: mailserver
    ports:
      - 9000:9000
      - 2500:2500

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9002:9002
      - 9001:9001
    volumes:
      - koudmain-minio:/data
    environment:
      MINIO_ROOT_USER: documenso
      MINIO_ROOT_PASSWORD: password
    entrypoint: sh
    command: -c 'mkdir -p /data/documenso && minio server /data --console-address ":9001" --address ":9002"'

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - 3005:3000

volumes:
  koudmain-db:
  koudmain-db-test:
  koudmain-redis:
  koudmain-minio: